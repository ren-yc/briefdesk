[build-system]
# PEP 639 的 project.license-files 自 setuptools 77.0.0 起可用：只改 [project]
# 而不抬这个下限，干净构建环境取到 68–76 时会直接校验失败。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "briefdesk"
version = "0.1.0"
description = "简报台 - BRIEFDESK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# PyPI 页面上的作者署名；不写 classifiers（许可已由 PEP 639 的 SPDX 字段表达）
authors = [{ name = "ren-yc" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "openai>=1.58",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "json-repair>=0.63",
    "python-multipart>=0.0.9",
    # 系统密钥环（Windows=凭据管理器/DPAPI）：密钥型配置的第一解析层，
    # 见 briefdesk/secrets_store.py；无桌面会话时自动回退环境变量/.env
    "keyring>=24",
    # 用户配置目录：UI「启动配置」暂存文件位置（settings_env.py）
    "platformdirs>=4",
    # vendor 的两个 Python SDK（weflow_sdk/qqflow_sdk，git subtree 随包分发）
    # 唯一新增传递依赖：生成层模型用到 dateutil
    "python-dateutil>=2.8",
]

# 索引页面的 Homepage / Repository / Issues 三个入口都靠这里；必须放在 dependencies 之后——
# TOML 的子表头会终止 [project] 表，之后再写的键会落进 [project.urls]
[project.urls]
Homepage = "https://github.com/ren-yc/briefdesk"
Repository = "https://github.com/ren-yc/briefdesk"
Issues = "https://github.com/ren-yc/briefdesk/issues"

[project.scripts]
briefdesk = "briefdesk.main:main"

[project.entry-points."briefdesk.plugins"]
weflow = "briefdesk.plugins.weflow.plugin:plugin"
weflow-legacy = "briefdesk.plugins.weflow_legacy.plugin:plugin"
qqflow = "briefdesk.plugins.qqflow.plugin:plugin"
ai_provider = "briefdesk.plugins.ai_provider.plugin:plugin"
ocr = "briefdesk.plugins.ocr.plugin:plugin"
classify = "briefdesk.plugins.classify.plugin:plugin"
dedup = "briefdesk.plugins.dedup.plugin:plugin"
merge = "briefdesk.plugins.merge.plugin:plugin"
calendar = "briefdesk.plugins.calendar.plugin:plugin"
reminders = "briefdesk.plugins.reminders.plugin:plugin"
benchmark = "briefdesk.plugins.benchmark.plugin:plugin"
rag = "briefdesk.plugins.rag.plugin:plugin"

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["briefdesk", "briefdesk.*", "weflow_sdk", "weflow_sdk.*", "qqflow_sdk", "qqflow_sdk.*"]


[tool.setuptools]
# 只放行显式声明的 package-data；关掉 include-package-data，免得将来有人加
# MANIFEST.in / setuptools_scm 后把脏树文件（reports/、*.fromweb.json、.tmp/）带进 wheel。
include-package-data = false

[tool.setuptools.package-data]
# 键是包名；模式相对该包目录，`*` 不跨目录分隔符。
# briefdesk/ui/ 与各插件 ui/ 都不是包（无 __init__.py），因此数据按所属包声明。
"briefdesk" = [
    "ui/*.html",
    "ui/*.js",
    "ui/*.css",
    "ui/icons/*.svg",
]
# 插件前端：四个带前端的插件各 2 个文件（ui.js/ui.css）
"briefdesk.plugins.calendar" = ["ui/*"]
"briefdesk.plugins.reminders" = ["ui/*"]
"briefdesk.plugins.rag" = ["ui/*"]
"briefdesk.plugins.benchmark" = ["ui/*", "cases/*.example.json"]
# vendor 的两个 SDK：生成层的 spec 快照与 py.typed 标记随包分发
"weflow_sdk" = ["generated/**/spec.json", "py.typed"]
"qqflow_sdk" = ["generated/**/spec.json", "py.typed"]

[project.optional-dependencies]
# OCR 阶段插件（briefdesk.plugins.ocr）的运行时依赖：不安装时 OCR 插件
# 自禁用（PluginDisabledError），其余功能不受影响
ocr = [
    "rapidocr>=3.9",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.3",
    # 测试套件的硬依赖：asyncio_mode = "auto"（见 [tool.pytest.ini_options]）
    # 生效前提，且 required_plugins 会在插件缺失时显式报错
    "pytest-asyncio>=1.4",
    # starlette.testclient 首选 httpx2 作为 HTTP 后端；缺它则每次 import
    # TestClient 都发 StarletteDeprecationWarning（6 个 TestClient 测试文件）。
    # 仅测试侧使用，生产仍用 httpx。
    "httpx2>=2.12",
    "ruff>=0.9",
    "mypy>=1.11",
    "pip-tools>=7.4",
    # 构建与元数据校验：本地门禁跑 `python -m build --wheel` +
    # `python -m twine check dist/*`（完整 wheel 冒烟在独立 CI job）
    "build>=1.2",
    "twine>=6",
]

[tool.mypy]
# pydantic 插件：参与模型构造签名的生成（注意：对带 alias 的字段按别名
# 生成 kwargs，populate_by_name 不被插件识别——测试里以别名构造 Settings）
plugins = ["pydantic.mypy"]
# vendor/ 是 git subtree 的上游镜像（禁改）：不参加本仓类型检查
exclude = ["vendor"]

# tests/ 纳入门禁的范围是「签名级」检查（函数注解、import、模块级语句）：
# 实测开启 check_untyped_defs 后全量函数体检查会在测试套件上产生约 200 个
# 桩惯用法噪音（假客户端传入具名类型参数、部分字段 TypedDict 夹具、
# fetchone() 可空值直接索引等），修齐需先给测试引入共享夹具与 Protocol 桩，
# 属独立重构；briefdesk/ 维持默认严格度不变。
# 若后续要深化，从此处放开并按错误码逐类收敛。

[tool.ruff]
# vendor/ 是 git subtree 的上游镜像（禁改）：不参加本仓 lint
exclude = ["vendor"]

[tool.ruff.lint]
# 在 ruff 默认规则（E/F）之上追加日志相关两组：
#   G   flake8-logging-format —— 禁 f-string/`+`/`.format()` 拼日志（G004/G003/G001）。
#       日志的参数应交给 logging 惰性求值：被 level 过滤掉的行不该付格式化代价，
#       且 `%s` 形态让同一条日志在不同参数下仍是同一个可 grep 的模板。
#   LOG flake8-logging —— 抓 logger 用法本身的坑（如 `logging.warn`、
#       exception 处理器里误用 `logger.error` 而丢掉 traceback）。
# 这两组是本次日志格式一致化的「防回归闸门」：没有它，新增的 f-string 日志
# 只能靠 review 发现。
extend-select = ["G", "LOG"]

[tool.pytest.ini_options]
# testpaths：不带参数跑 pytest 时只收集 tests/，避免误入工作区其它目录
testpaths = ["tests"]
# IsolatedAsyncioTestCase 迁移到 pytest 风格后的运行前提（asyncio_mode=auto）：
# async 测试与异步夹具无需逐个标记；夹具与测试必须同循环（对齐 unittest 的
# 每用例独立 loop 语义），因此固定 function 作用域，禁止改为 session/module
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 插件缺失时收集即报 "Missing required plugins"（显式失败），而非静默跳过
required_plugins = ["pytest-asyncio"]
