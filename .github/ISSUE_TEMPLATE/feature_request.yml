name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请优先描述「要解决的问题与使用场景」，这比具体实现方案更能帮助评估。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其它可行的做法，或你目前使用的临时解决方式。
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 截图或相关配置示例（记得脱敏，密钥用 `<your-api-key>` 占位）。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索既有 issue，确认无重复
          required: true
        - label: 我已确认以上内容不含真实聊天记录、手机号、QQ/微信 ID、Token 或 Key
          required: true
