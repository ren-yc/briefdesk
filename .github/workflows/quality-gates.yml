# Quality gates: aligned with the "pre-commit quality gates" in AGENTS.md.
# Triggers: push to master / pull requests.
# Notes:
# - windows-latest matches the dev environment (keyring behaves differently on
#   headless Linux runners; avoids platform-specific noise)
# - matrix covers 3.12 (the declared minimum in requires-python), 3.13, and
#   3.14 (the version the dev environment actually runs — asyncio task
#   cancellation and non-daemon worker-thread teardown differ enough across
#   these that main.py's lifecycle warrants all three being verified)
# - dependencies install from requirements-dev.txt, a pip-compile'd closure of
#   [dev,ocr] — NOT a whole-environment freeze: a freeze pins packages the
#   project never imports, so an unrelated yank or missing wheel breaks CI.
#   Regenerate with the command recorded in the lockfile's own header. The
#   package itself is installed editable with --no-deps on top of the lockfile.
# - both [dev] and [ocr] extras are covered: rapidocr/onnxruntime are heavy,
#   but the OCR plugin runs in production and its tests cover real engine
#   wiring; the lockfile already contains them
# - mypy checks the package only: test files are covered by ruff + pytest,
#   and type-checking test-stub idioms is signature-level noise
#   (see the [tool.mypy] comments in pyproject.toml); AGENTS.md notes the
#   local gate additionally runs mypy over tests/
# - secret scan runs on both event types, mirroring the pre-commit hook (which
#   scans staged content only): PRs diff against origin/master, pushes against
#   the pre-push commit. Guarding PRs alone would leave the direct-to-master
#   path — the one this repo actually uses — unchecked.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Superseded runs are wasted: at three matrix jobs per trigger, a burst of
# pushes to an open PR otherwise stacks up whole matrices behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates (ruff / mypy / pytest) — py${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies (lockfile + editable package)
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Secret scan (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin master
          python scripts/secret_scan.py --ref origin/master

      # github.event.before is the all-zeros SHA on a branch's first push;
      # fall back to origin/master there rather than scanning an empty diff.
      - name: Secret scan (push diff)
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin master
            before="origin/master"
          fi
          python scripts/secret_scan.py --ref "$before"

      # AGENTS.md's 4th gate. The pre-commit hook only runs the secret scan, so
      # without this step the check rests on the author remembering it.
      # Diffing against the empty-tree SHA covers every tracked file instead of
      # a push range: same behaviour on push and PR, and no all-zeros base to
      # special-case. Verified clean at this baseline. AGENTS.md's local gates
      # mirror this command, so committed whitespace issues surface before push
      # (a working-tree-only check goes blind once the problem is committed).
      - name: Whitespace / conflict marker check
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904..HEAD

      - name: Lint (ruff)
        run: python -m ruff check briefdesk/ tests/

      - name: Type check (mypy, package only)
        run: python -m mypy briefdesk/

      - name: Test (pytest)
        run: python -m pytest tests/
