# 发布 workflow：人工触发 + 环境审批 + OIDC 可信发布（无长期凭据）。
#
# 为什么分两个 job：两条约束指向不同平台——
# - 上传用的 pypa/gh-action-pypi-publish 是 Docker 容器动作，只在 Linux runner 上能跑
#   （放 Windows 上会在跑任何逻辑之前直接以 "This action is only able to run under
#   GNU/Linux environments" 失败）；
# - 装完之后的 wheel 冒烟要验的是用户实际运行的平台（主平台 Windows），它的进程清理契约
#   （terminate → 等 → kill、文件占用导致删不掉）也只在 Windows 上成立。
# 拆开之后审批闸门仍只在上传那一步：environment 挂在 publish job 上，verify 只读。
#
# 为什么不并进 quality-gates.yml：id-token 写权限只应出现在真正要发布的 workflow 里；门禁
# 每次 push 都跑，也不需要任何写权限。
#
# 为什么不用 twine 上传：OIDC 的短期凭据只对 pypa/gh-action-pypi-publish 可见，本机与其它
# 步骤都不持有上传凭据——「谁能发」由 GitHub 的 environment 审批决定，而不是谁的钥匙串里有 token。
#
# 一次性配置（仓库外）：
# - GitHub environments：testpypi（可无保护）、pypi（建议配 Required reviewers）；
# - TestPyPI / PyPI 各登记 trusted publisher：Owner ren-yc、Repository briefdesk、
#   Workflow name publish.yml、Environment 与上面同名。
name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标索引"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      version:
        description: "要发布的版本（试发如 0.1.0rc1；正式必须等于 pyproject 的静态版本）"
        type: string
        required: true

# 同一目标不允许并发发布：版本唯一性预检与上传之间被插队会撞上「同版本不可覆盖」
concurrency:
  group: publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 人工闸门：pypi 环境配 Required reviewers 后，job 会停在审批上等人放行
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write      # OIDC 可信发布
      attestations: write  # PEP 740 构建证明
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 只允许从 master 发布：分支上的提交没走完门禁，而索引上的版本不可撤回。
      # workflow_dispatch 允许选分支/标签，这个判据把它挡在门外；这里不需要再比对
      # origin/master——在 Actions 里被检出的提交本来就来自远端。
      - name: Guard against non-master refs
        shell: bash
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "只能从 master 发布，当前 ref 是 ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 只装锁文件：构建器（build）与 twine 都在锁里
      - name: Install build tooling (lockfile)
        run: pip install -r requirements-dev.txt

      # 版本唯一性预检 + 构建 + 产物成员断言 + twine check；正式索引下版本必须等于仓库静态值
      - name: Build and verify artifacts
        run: python scripts/release_check.py --target ${{ inputs.target }} --version ${{ inputs.version }}

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # 装完才算验完：与 CI 的 wheel 冒烟同一条脚本（两条安装路径 + 启动 + 资源 + 写入隔离）。
  # 它按「索引 + 版本」安装，装到的就是上面刚上传的那两件产物，因此 job 之间不必传文件。
  # 上传成功到索引可见之间有秒级延迟，冒烟取元数据时会等该版本挂出来（见 wheel_smoke.py 的
  # INDEX_WAIT_SECONDS）——放进 shell 里做会多一份环境相关的失败面（本机演练时 $host 撞上
  # PowerShell 自动变量，步骤就一直在重试）。
  verify:
    name: Verify installs (windows, ${{ inputs.target }})
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # headless runner 没有凭据管理器会话：密钥层走「未配置」分支（与 wheel-smoke job 同口径）
      BRIEFDESK_KEYRING: "0"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 冒烟自己 import packaging，并用它解析依赖 marker：锁文件里就有
      - name: Install build tooling (lockfile)
        run: pip install -r requirements-dev.txt

      - name: Verify wheel install path
        run: python scripts/wheel_smoke.py --install-from ${{ inputs.target }} --version ${{ inputs.version }}

      - name: Verify sdist install path
        run: python scripts/wheel_smoke.py --install-from ${{ inputs.target }} --version ${{ inputs.version }} --from-sdist
